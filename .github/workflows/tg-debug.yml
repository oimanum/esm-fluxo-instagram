name: tg-debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tg-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ver o que o Telegram guardou para o bot (não consome nada)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node src/cli.js tgdebug
