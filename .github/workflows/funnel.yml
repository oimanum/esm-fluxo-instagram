name: funnel
on:
  schedule:
    - cron: '4-54/10 * * * *' # a cada 10 minutos; sai logo se o funil estiver desligado em src/config.js
  workflow_dispatch:
concurrency:
  group: instagram-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Responder no Direct quem comentou a palavra-chave
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node src/cli.js funnel
      - name: Salvar estado
        if: always()
        run: node src/cli.js checkpoint
