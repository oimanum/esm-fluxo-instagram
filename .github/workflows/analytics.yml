name: analytics
on:
  schedule:
    - cron: '11 22 * * 0' # domingo 19:00 em Brasília
  workflow_dispatch:
concurrency:
  group: instagram-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # o job espera na fila do grupo de concorrência: o estado (data/) tem que ser o mais recente, não o do disparo
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node src/cli.js analytics
      - if: always()
        run: node src/cli.js checkpoint
