name: approval-poll
on:
  schedule:
    - cron: '3-53/10 10-14 * * *' # 07:03 a 11:53 em Brasília; o prazo de aprovação é 11:00 (+20 min)
  workflow_dispatch:
concurrency:
  group: instagram-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler aprovações e publicar
        id: poll
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node src/cli.js poll
      # "Trocar tema" precisa de ffmpeg e voz; só instala quando alguém pediu a troca.
      - name: Preparar render (só se houver troca de tema)
        if: steps.poll.outputs.swap == 'true'
        uses: ./.github/actions/setup
      - name: Gerar o tema novo
        if: steps.poll.outputs.swap == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE }}
          MOTION_STYLE: ${{ vars.MOTION_STYLE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node src/cli.js swap
      - name: Salvar estado
        if: always()
        run: node src/cli.js checkpoint
