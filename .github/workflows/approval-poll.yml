name: approval-poll
on:
  schedule:
    - cron: '*/10 10-14 * * *' # 07:00 a 11:50 em Brasília; depois das 11:00 só expira
  workflow_dispatch:
concurrency: instagram-state
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler aprovações e publicar
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node src/cli.js poll
      - name: Salvar estado
        run: |
          git config user.name "esm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: estado da aprovação" && git push)
