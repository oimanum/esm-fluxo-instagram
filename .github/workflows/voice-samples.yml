name: voice-samples
on:
  workflow_dispatch:
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Gerar amostras de voz
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: node scripts/voice-samples.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voices
          path: out/voices/
