name: generate
on:
  schedule:
    - cron: '7 9 * * *' # ~06:00 em Brasília (minuto 7 evita o pico de atrasos do GitHub)
    - cron: '47 9 * * *' # segunda tentativa (~06:47): só age se o post do dia ainda não foi gerado
    - cron: '17 12 * * *' # reforço (~09:17): o GitHub às vezes atrasa ou perde agendamentos; só age se o post do dia ainda não foi gerado
  workflow_dispatch:
    inputs:
      dry:
        description: 'Prévia de TESTE: sem botões, não publica'
        type: boolean
        default: true
concurrency:
  group: instagram-state
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # o job espera na fila do grupo de concorrência: o estado (data/) tem que ser o mais recente, não o do disparo
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup
      - name: Gerar conteúdo e enviar prévia
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE }}
          MOTION_STYLE: ${{ vars.MOTION_STYLE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node src/cli.js generate ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }}
      - name: Salvar estado
        if: always()
        run: node src/cli.js checkpoint
      - name: Abrir a escuta do Telegram (o toque em Aprovar é lido em segundos)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run approval-listen.yml
